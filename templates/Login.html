{% extends "base.html" %}
{% block title %}{{ t('btn_login') }} - Electro_Fahes{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Electro_Fahes" class="auth-logo">
                <h1 class="auth-title">{{ t('auth_welcome') }}</h1>
                <p class="auth-subtitle">{{ t('auth_sign_in_subtitle') }}</p>
            </div>
            
            <form method="POST" action="{{ url_for('login') }}">
                <div class="form-group">
                    <label for="email" class="form-label">{{ t('label_email') }}</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        class="form-control" 
                        placeholder="{{ t('placeholder_email') }}"
                        required
                        autocomplete="email">
                </div>
                
                <div class="form-group">
                    <label for="password" class="form-label">{{ t('label_password') }}</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="form-control" 
                        placeholder="{{ t('placeholder_password') }}"
                        required
                        autocomplete="current-password">
                </div>
                
                <button type="submit" class="btn btn-primary btn-full btn-large">
                    {{ t('btn_login') }}
                </button>
            </form>
            
            <div class="auth-footer">
                <p>{{ t('link_no_account') }} <a href="{{ url_for('register') }}">{{ t('link_create_one') }}</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
